name: Model freshness watch

# The operation inventory was extracted by hand and every coverage number in
# the conformance report is measured against it. When AWS adds an operation or
# changes a route, that number starts lying silently. This job is the alarm.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    name: Inventory vs upstream models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true

      - name: Check inventory against upstream service models
        id: watch
        run: |
          set +e
          go run ./conformance/cmd/modelwatch | tee /tmp/drift.txt
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Open or update the drift issue
        if: steps.watch.outputs.status == '1'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = await import('node:fs');
            const report = fs.readFileSync('/tmp/drift.txt', 'utf8');
            const title = 'Model drift: upstream service models diverge from inventory.json';
            const body = [
              'The scheduled model watch found drift between the upstream service models',
              'and the committed `conformance/inventory.json`.',
              '',
              'Coverage numbers in the conformance report are measured against that',
              'inventory, so until this is reconciled they understate or overstate what',
              'the suite actually covers. Reconciling means updating the inventory *and*',
              'authoring cases for anything newly added.',
              '',
              '```',
              report.trim(),
              '```',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'model-drift',
            });

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['model-drift'],
              });
            }

      - name: Fail the run when drift was found
        if: steps.watch.outputs.status == '1'
        run: exit 1
